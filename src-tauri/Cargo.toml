[package]
name = "dynamic-island"
version = "0.3.4"
description = "Dynamic Island for Windows"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[lib]
name = "dynamic_island_lib"
# Desktop only: the Tauri template's `staticlib`/`cdylib` exist for mobile and
# made every dev rebuild also write a ~900 MB static lib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
json5 = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
log = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
png = "0.17"
# Calendar: iCal recurrence + time zones, Google OAuth (PKCE).
rrule = "0.14"
chrono-tz = "0.10"
sha2 = "0.10"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
# Drags shelf items out of the island into other apps (OLE drag & drop).
drag = "2"
# `IIterable` / `IMapView` for WinRT calls (`windows` doesn't re-export them).
windows-collections = "0.3"
# `#[implement]` (the drop target in `file_drop.rs`) expands to `windows_core::…`.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Devices_Enumeration",
  "Win32_Devices_Display",
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "UI_Notifications",
  "UI_Notifications_Management",
] }

# Faster dev rebuilds: line tables are enough for backtraces, and nobody
# steps through dependencies in a debugger.
[profile.dev]
debug = "line-tables-only"
incremental = true # Compile your binary in smaller steps.

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
