[package]
name = "dynamic-island"
version = "0.1.2"
description = "Dynamic Island for Windows"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[lib]
name = "dynamic_island_lib"
# Desktop only: the Tauri template's `staticlib`/`cdylib` exist for mobile and
# made every dev rebuild also write a ~900 MB static lib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
json5 = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
log = "0.4"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Faster dev rebuilds: line tables are enough for backtraces, and nobody
# steps through dependencies in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
