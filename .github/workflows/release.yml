name: Release

# Push a version tag (e.g. `bun run v patch && git push --follow-tags`) to build
# the Windows installers and publish them as a GitHub release. Can also be run
# by hand from the Actions tab; the release is named after the app version.
#
# In parallel, the `msix` job builds the Microsoft Store edition
# (scripts/package-msix.ps1), keeps it as a workflow artifact (it never goes
# into the release) and submits it to the Store for certification. Run by hand
# with "Store only" ticked to rebuild and resubmit just the MSIX.
#
# Neither job saves the Rust cache: a tag's cache can't be restored by the next
# tag. They restore the one cache.yml keeps warm on main instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      store-only:
        description: Store only (build the MSIX, no GitHub release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ !inputs.store-only }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history, so the notes can diff against the last release.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri -> target
          save-if: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Release notes: commits pushed straight to main since the previous tag,
      # plus GitHub's generated list of merged pull requests (whose own commits
      # are left out of the first list, being off the first-parent line).
      - name: Release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          else
            prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          range=${prev:+$prev..}HEAD

          commits=$(git log "$range" --first-parent --no-merges --format='%s|%h|%H' \
            | grep -Ev '^v?[0-9]+\.[0-9]+\.[0-9]+\|' \
            | while IFS='|' read -r subject short full; do
                echo "- $subject ([\`$short\`](${{ github.server_url }}/${{ github.repository }}/commit/$full))"
              done)

          generated=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            ${prev:+-f previous_tag_name="$prev"} --jq .body)

          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo 'Download **`Dynamic.Island_*_x64-setup.exe`** and run it (installs for the current user, no admin needed).'
            echo 'The `.msi` is there for managed installs.'
            echo 'No install at all? Grab **`Dynamic.Island_*_x64-portable.zip`**, extract it anywhere and run `dynamic-island.exe` (it does not update itself).'
            if [ -n "$commits" ]; then
              echo
              echo '## Commits'
              echo "$commits"
            fi
            echo
            echo "$generated"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app checks them against the
          # `plugins.updater.pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OAuth client ("Desktop app") built in for Google Calendar sign-in.
          # Without it, users paste their own in the settings window.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tauriScript: bun tauri
          tagName: v__VERSION__
          releaseName: Island for Windows v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # `latest.json` is what installed apps poll to find updates.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false

      # Portable build: the same exe plus an empty `.portable` marker, which
      # turns off self-update and autostart-on-first-run (src/portable.rs).
      - name: Portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $dir = "portable/Dynamic Island"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/dynamic-island.exe $dir
          New-Item -ItemType File "$dir/.portable" | Out-Null
          $zip = "Dynamic.Island_${version}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release upload "v$version" $zip --clobber

  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: store
          workspaces: src-tauri -> target/store
          save-if: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The package identity comes from the repository variables
      # MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME
      # (Partner Center, Product identity).
      - name: Build and pack
        id: pack
        shell: pwsh
        env:
          # OAuth client ("Desktop app") built in for Google Calendar sign-in.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          ./scripts/package-msix.ps1 `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "msix=$((Get-Item src-tauri/target/store/*.msix).FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: msix-v${{ steps.pack.outputs.version }}
          path: src-tauri/target/store/*.msix
          if-no-files-found: error

      # Store submission disabled: the product is priced per market in Partner
      # Center, and msstore can't preserve that price ('Base') on update; it
      # only accepts a single --priceId. Submit the msix artifact above from
      # Partner Center instead.
      #
      # Partner Center API access through the `msstore-ci` app registration in
      # Microsoft Entra (Partner Center, User management, Microsoft Entra
      # applications, role Manager). Its client secret expires: renew it there
      # and update AZURE_AD_APPLICATION_SECRET, or this step fails.
      # - uses: microsoft/microsoft-store-apppublisher@v1.4
      #
      # - name: Submit to the Store
      #   shell: pwsh
      #   env:
      #     TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      #     SELLER_ID: ${{ secrets.SELLER_ID }}
      #     CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      #     CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      #   run: |
      #     msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
      #     if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
      #     msstore publish "${{ steps.pack.outputs.msix }}" --appId "${{ vars.STORE_PRODUCT_ID }}"
      #     if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
