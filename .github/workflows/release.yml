name: Release

# Push a version tag (e.g. `bun run v patch && git push --follow-tags`) to build
# the Windows installers and publish them as a GitHub release. Can also be run
# by hand from the Actions tab; the release is named after the app version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app checks them against the
          # `plugins.updater.pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OAuth client ("Desktop app") built in for Google Calendar sign-in.
          # Without it, users paste their own in the settings window.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tauriScript: bun tauri
          tagName: v__VERSION__
          releaseName: Dynamic Island v__VERSION__
          releaseBody: |
            Download **`Dynamic.Island_*_x64-setup.exe`** and run it (installs for the current user, no admin needed).
            The `.msi` is there for managed installs.
          # `latest.json` is what installed apps poll to find updates.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false
