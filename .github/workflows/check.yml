name: Check

# Type-checks and builds the frontend, then compiles and lints the backend on
# every push and pull request, so breakage shows up before a release tag.
on:
  push:
    branches-ignore: ["main"]
    paths-ignore:
      - website/**
  pull_request:
    paths-ignore:
      - website/**

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Also produces `dist/`, which `tauri::generate_context!` embeds.
      - name: Build frontend
        run: bun run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      # A dependency change shows up here before `Cargo.lock` is committed.
      - name: Lockfile up to date
        run: git diff --exit-code -- src-tauri/Cargo.lock

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: src-tauri/Cargo.lock
