# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/src-tauri" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # windows-rs crates share types across versions; they must move together.
      windows:
        patterns:
          - "windows"
          - "windows-*"
    ignore:
      # Tauri pins these too; a breaking bump (0.x minor) only duplicates them in the build.
      # Revisit when Tauri itself upgrades.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "bun" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
